# ── Prompt to Video Studio · backend on Render.com ─────────────────────────────
# Usage: push the repo to GitHub, then in the Render dashboard
# "New +" → "Blueprint" → select this repo. Render reads this file and creates
# the web service. Then set the secret env vars in the dashboard.
# Full step-by-step: see DEPLOY.md (Option C).

services:
  - type: web
    name: prompt-to-video-studio-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    # Render injects PORT automatically — do NOT set it here.
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://prompt-to-video-studio.vercel.app # ← change to YOUR Vercel URL
      - key: AI_API_URL
        value: https://api.groq.com/openai/v1 # ← or OpenAI / OpenRouter endpoint
      - key: AI_MODEL
        value: llama-3.3-70b-versatile # ← model matching the endpoint above
      - key: JOB_TTL_MINUTES
        value: "60"
      - key: AI_API_KEY
        sync: false # set the real key in the Render dashboard, never in this file
