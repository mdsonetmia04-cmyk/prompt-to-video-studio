# ── Prompt to Video Studio · backend on Fly.io ─────────────────────────────────
# Usage:
#   cd backend
#   fly launch --no-deploy        # creates the app; accept the generated name or set your own
#   fly secrets set AI_API_KEY="..." CORS_ORIGINS="https://<your-vercel-site>.vercel.app"
#   fly deploy
# Full step-by-step: see DEPLOY.md (Option B).
#
# NOTE: replace the placeholder app name below with your real app name
# (or let `fly launch` rewrite this file).

app = "prompt-to-video-studio-backend"
primary_region = "sin" # Singapore — closest region to Bangladesh

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"      # keep warm so render jobs are not killed mid-encode
  auto_start_machines = true
  min_machines_running = 1        # 1 machine always on = billed continuously
  processes = ["app"]

# 1080p frame capture is memory-hungry; 720p fits in 1 GB, 1080p wants 2 GB.
# Fly charges by machine size — start at 1 GB, raise to 2 GB if 1080p renders OOM.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[checks]
  [checks.health]
    grace_period = "120s"
    interval = "60s"
    timeout = "10s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    port = 8080
